# Render Blueprint: a free, public DEMO deployment (mock AI provider, fake demo data).
# The free plan has no persistent disk, so the database is re-created and re-seeded on every start.
# Do not use this file as-is for real users: see README "Deploying".
services:
  - type: web
    name: mockroom-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:demo
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: DATABASE_PATH
        value: ./data/app.db
      - key: UPLOAD_DIR
        value: ./data/uploads
